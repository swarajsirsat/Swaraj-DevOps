services:
  db:
    image: postgres:14-alpine
    container_name: next_notes_db
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-notesdb}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-net

  nextapp:
    container_name: next_notes_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${DB_USER:-user}:${DB_PASSWORD:-password}@next_notes_db:5432/${DB_NAME:-notesdb}
    depends_on:
      - db
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  db_data:
